spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sensor   # use 5433 se mapeou 5433:5432
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
        hibernate.format_sql: true
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  spring:
    rsocket:
      server:
        port: 8080       # porta do RSocket
        address: 0.0.0.0     # escuta em todas as interfaces (não só localhost)
        transport: tcp